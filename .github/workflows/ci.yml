name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Soak duration in minutes'
        required: false
        default: '240'
        type: string

concurrency:
  group: cfsharp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test-pack:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Verify supported platform matrix
        shell: pwsh
        run: ./eng/verify-platform-matrix.ps1

      - name: Restore
        run: dotnet restore CfSharp.sln

      - name: Verify dependency audit and provenance
        shell: pwsh
        run: ./eng/verify-dependency-audit.ps1

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit
          path: artifacts/dependency-audit/**
          if-no-files-found: error

      - name: Verify formatting
        run: dotnet format CfSharp.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build CfSharp.sln --configuration Release --no-restore

      - name: Verify managed API baseline
        shell: pwsh
        run: ./eng/verify-api-baseline.ps1 -Configuration Release

      - name: Verify trim and Native AOT boundaries
        shell: pwsh
        run: ./eng/verify-runtime-boundaries.ps1

      - name: Upload runtime boundary evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-boundaries
          path: artifacts/runtime-boundaries/**
          if-no-files-found: error

      - name: Test
        run: dotnet test CfSharp.sln --configuration Release --no-build --filter "Category!=AbiProbe&Category!=ApiBaseline&Category!=LongSoak" --logger "trx;LogFileName=test-results.trx" --collect "XPlat Code Coverage"

      - name: Pack native bindings
        run: dotnet pack src/CfSharp.Native/CfSharp.Native.csproj --configuration Release --no-build --output artifacts/packages -p:Version=0.0.0-ci.${{ github.run_number }} -p:PackageVersion=0.0.0-ci.${{ github.run_number }}

      - name: Pack high-level library
        run: dotnet pack src/CfSharp/CfSharp.csproj --configuration Release --no-build --output artifacts/packages -p:Version=0.0.0-ci.${{ github.run_number }} -p:PackageVersion=0.0.0-ci.${{ github.run_number }}

      - name: Pack SQLite state provider
        run: dotnet pack src/CfSharp.Storage.Sqlite/CfSharp.Storage.Sqlite.csproj --configuration Release --no-build --output artifacts/packages -p:Version=0.0.0-ci.${{ github.run_number }} -p:PackageVersion=0.0.0-ci.${{ github.run_number }}

      - name: Verify isolated package capabilities on x64
        shell: pwsh
        run: ./eng/prepare-preview.ps1 -Version '0.0.0-preview.${{ github.run_number }}' -Channel Preview -OutputDirectory artifacts/package-capabilities

      - name: Upload x64 package capability evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: package-capabilities-x64
          path: |
            artifacts/package-capabilities/**/manifest.json
            artifacts/package-capabilities/**/consumer-smoke/packages.lock.json
            artifacts/package-capabilities/**/packages/*
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: "**/TestResults/**"
          if-no-files-found: ignore

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: artifacts/packages/*

  test-arm64:
    runs-on: windows-11-arm
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Verify ARM64 runner
        shell: pwsh
        run: |
          $runtimeArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
          $processArchitecture = [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString()
          if ($runtimeArchitecture -ne 'Arm64' -or $processArchitecture -ne 'Arm64') {
            throw "The ARM64 job ran on an unexpected architecture: runtime=$runtimeArchitecture process=$processArchitecture"
          }
          "Runtime architecture: $runtimeArchitecture"
          "Process architecture: $processArchitecture"
          "Runner OS: $([System.Environment]::OSVersion.VersionString)"
          dotnet --info

      - name: Verify supported platform matrix
        shell: pwsh
        run: ./eng/verify-platform-matrix.ps1

      - name: Restore
        run: dotnet restore CfSharp.sln

      - name: Verify formatting
        run: dotnet format CfSharp.sln --verify-no-changes --no-restore

      - name: Build ARM64 solution
        run: dotnet build CfSharp.sln --configuration Release --no-restore --disable-build-servers -m:1

      - name: Verify trim and Native AOT boundaries
        shell: pwsh
        run: ./eng/verify-runtime-boundaries.ps1 -Configuration Release

      - name: Test ARM64 solution
        run: dotnet test CfSharp.sln --configuration Release --no-build --no-restore --disable-build-servers -m:1 --filter "Category!=AbiProbe&Category!=ApiBaseline&Category!=LongSoak" --logger "trx;LogFileName=arm64-test-results.trx" --blame-hang-timeout 2m

      - name: Verify isolated package capabilities on ARM64
        shell: pwsh
        run: ./eng/prepare-preview.ps1 -Version '0.0.0-preview.${{ github.run_number }}' -Channel Preview -OutputDirectory artifacts/package-capabilities

      - name: Upload ARM64 test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-arm64
          path: |
            **/TestResults/**
            artifacts/runtime-boundaries/**
            artifacts/package-capabilities/**/manifest.json
            artifacts/package-capabilities/**/consumer-smoke/packages.lock.json
            artifacts/package-capabilities/**/packages/*
          if-no-files-found: error

  native-abi-x64:
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Configure x64 ABI probe
        run: cmake -S tests/CfSharp.Native.AbiProbe -B artifacts/abi-probe/build -A x64

      - name: Build x64 ABI probe
        run: cmake --build artifacts/abi-probe/build --config Release

      - name: Capture native ABI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/abi-probe | Out-Null
          & artifacts/abi-probe/build/Release/CfSharp.Native.AbiProbe.exe |
            Set-Content -Encoding utf8 artifacts/abi-probe/x64.json

      - name: Restore native tests
        run: dotnet restore tests/CfSharp.Native.Tests/CfSharp.Native.Tests.csproj

      - name: Verify native ABI evidence
        shell: pwsh
        run: |
          $probePath = Join-Path $env:GITHUB_WORKSPACE 'artifacts/abi-probe/x64.json'
          if (-not (Test-Path -LiteralPath $probePath -PathType Leaf)) {
            throw "Native ABI probe JSON is missing: $probePath"
          }
          $probe = Get-Content -LiteralPath $probePath -Raw | ConvertFrom-Json
          if ($null -eq $probe -or $probe.pointerSize -ne 8) {
            throw "Native ABI probe JSON is empty or not an x64 probe: $probePath"
          }

      - name: Compare managed and native ABI
        run: dotnet test tests/CfSharp.Native.Tests/CfSharp.Native.Tests.csproj --configuration Release --no-restore --logger "trx;LogFileName=abi-test-results.trx"
        env:
          CFSHARP_ABI_PROBE_JSON: ${{ github.workspace }}\artifacts\abi-probe\x64.json

      - name: Upload ABI results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-abi-x64
          path: |
            artifacts/abi-probe/x64.json
            tests/CfSharp.Native.Tests/TestResults/**
          if-no-files-found: error

  long-soak:
    if: github.event_name == 'workflow_dispatch'
    name: long-soak-${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2022
          - architecture: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CfSharp.sln

      - name: Run bounded soak
        shell: pwsh
        run: ./eng/run-soak.ps1 -DurationMinutes ([int]'${{ inputs.duration_minutes }}')

      - name: Upload soak evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: long-soak-evidence-${{ matrix.architecture }}
          path: artifacts/soak/**
          if-no-files-found: error
